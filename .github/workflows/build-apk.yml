name: Build NOVA Field 26 Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '3d-football-simulation-game (1).zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract game project
        run: |
          mkdir -p project
          unzip -q "3d-football-simulation-game (1).zip" -d project
          test -f project/package.json
          test -f project/android/build-apk.sh

      - name: Build web game
        working-directory: project
        run: |
          npm ci
          npm run build

      - name: Fix missing launcher icon resource
        working-directory: project
        run: |
          sed -i 's|@mipmap/ic_launcher|@android:drawable/sym_def_app_icon|g' android/app/src/main/AndroidManifest.xml
          sed -i 's|android:screenOrientation="sensorLandscape"|android:screenOrientation="portrait"|' android/app/src/main/AndroidManifest.xml

      - name: Build signed Android APK
        working-directory: project
        run: bash android/build-apk.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-Field-26-Android-APK
          path: project/public/NOVA-Field-26-arm64.apk
          if-no-files-found: error
          retention-days: 14
