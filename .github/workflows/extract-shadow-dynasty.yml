name: Extract Shadow Dynasty ZIP and build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "Shadow-Dynasty-GitHub-Package.zip"
      - ".github/workflows/extract-shadow-dynasty.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract the ZIP uploaded to the repository
        run: |
          mkdir -p /tmp/shadow-dynasty-package
          unzip -o "Shadow-Dynasty-GitHub-Package.zip" -d /tmp/shadow-dynasty-package
          test -f /tmp/shadow-dynasty-package/shadow-dynasty-app/settings.gradle
          test -f /tmp/shadow-dynasty-package/shadow-dynasty-app/app/src/main/assets/index.html

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Android debug APK
        run: gradle --no-daemon -p /tmp/shadow-dynasty-package/shadow-dynasty-app :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shadow-Dynasty-Android-APK
          path: /tmp/shadow-dynasty-package/shadow-dynasty-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
